[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behave-format"
version = "1.0.0"
description = "The opinionated formatter for Behave .feature files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Mathias Paulenko" },
]
keywords = ["behave", "bdd", "gherkin", "formatter", "format", "cucumber", "testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "behave-model>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
behave-format = "behave_format.cli.main:main"

[project.urls]
Homepage = "https://github.com/MathiasPaulenko/behave-format"
Repository = "https://github.com/MathiasPaulenko/behave-format"
Issues = "https://github.com/MathiasPaulenko/behave-format/issues"
Changelog = "https://github.com/MathiasPaulenko/behave-format/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["behave_format"]

[tool.behave-format]
indent = 2
sort_tags = true
sort_features = false
sort_scenarios = false
line_length = 120

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["behave_format"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["behave_format"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 75
